<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"><defs><pattern id="tone" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#111"/></pattern></defs><rect width="1200" height="340" fill="#fff"/><path d="M20 20 L1180 12 L1175 320 L25 325Z" fill="white" stroke="#111" stroke-width="7"/><text x="55" y="72" font-family="sans-serif" font-size="30" font-weight="900">MEET THE THREE IMPORTANT PEOPLE</text><g stroke="#111" stroke-width="5" fill="white"><rect x="75" y="120" width="280" height="145" rx="12"/><rect x="460" y="120" width="280" height="145" rx="12"/><rect x="845" y="120" width="280" height="145" rx="12"/></g><g font-family="sans-serif" fill="#111" text-anchor="middle"><text x="215" y="165" font-size="26" font-weight="bold">INVOICE</text><text x="215" y="205" font-size="18">"You owe $100."</text><text x="600" y="165" font-size="26" font-weight="bold">GATEWAY</text><text x="600" y="205" font-size="18">"I collected $100."</text><text x="985" y="165" font-size="26" font-weight="bold">BANK</text><text x="985" y="205" font-size="18">"I received $100."</text></g><path d="M355 190 H455 M740 190 H840" stroke="#111" stroke-width="6"/><path d="M440 178 L456 190 L440 202 M825 178 L841 190 L825 202" fill="none" stroke="#111" stroke-width="5"/><path d="M80 275 Q150 295 220 275 M470 275 Q550 295 630 275 M850 275 Q930 295 1010 275" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="5 8"/><text x="600" y="302" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#111">If the story doesn't line up, the engine raises its hand.</text></svg>